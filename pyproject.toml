[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-analytics-funnel-ab"
version = "1.0.0"
description = "Воспроизводимый учебный проект по воронке, удержанию и A/B-тесту"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analytics_project = []
